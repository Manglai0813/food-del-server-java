# ===============================================================
# Default Profile
# ===============================================================
server:
  port: 5000

logging:
  file:
    name: logs/food-del-server.log
  level:
    root: INFO
    com.fooddel: DEBUG # Application specific logs

spring:
  profiles:
    active: dev # Default environment is development
  redis:
    host: localhost
    port: 6379
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        naming:
          physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ===============================================================
# Custom Application Properties
# ===============================================================
app:
  jwt:
    secret: "FoodDelivery2024$SuperSecretJWT@Key#WithNumbers123&SpecialChars!"
    refresh-secret: "RefreshToken2024*SecureKey@WithMixedCase#789&ExtraLong$Characters"
  cors:
    allowed-origins: "http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS" # Added allowed methods
    allowed-headers: "Authorization,Content-Type,Accept" # Added allowed headers
    allow-credentials: true
  rate-limiting:
    enabled: false
    max-requests: 100
    window-ms: 900000
  file:
    upload-dir: uploads

---

# ===============================================================
# Development Profile
# ===============================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fooddb} # 環境変数を使用、デフォルト値あり
    username: ${DB_USERNAME:postgres} # 環境変数を使用、デフォルト値あり
    password: ${DB_PASSWORD:1234} # 環境変数を使用、デフォルト値あり（本番環境では必ず環境変数を設定すること）
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

---

# ===============================================================
# Production Profile
# ===============================================================
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
  datasource:
    url: ${DB_URL} # Use environment variables in production
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
